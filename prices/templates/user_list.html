<div class="table-responsive">
    <table class="table table-sm table-striped">
        <thead>
            <tr>
                <th>Email</th>
                <th class="text-center">Action</th>
            </tr>
        </thead>
        <tbody>
            {% for emp in employees %}
            <tr>
                <td>{{ emp.email }}</td>
                <td class="text-center">
                    <form method="post" action="{% url 'prices:user_delete' emp.id %}" style="display:inline;">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Remove this employee?')">
                            <i class="fas fa-user-minus"></i>
                        </button>
                    </form>
                </td>
            </tr>
            {% empty %}
            <tr><td colspan="2" class="text-center text-muted">No employees added yet.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
