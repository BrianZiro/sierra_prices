<div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Product Name</th>
                <th>Price</th>
                <th class="text-center">Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for product in products %}
            <tr>
                <td>{{ forloop.counter }}</td>
                <td>{{ product.name }}</td>
                <td>Ksh {{ product.price }}</td>
                <td class="text-center">
                    <button class="btn btn-sm btn-outline-primary me-1" data-bs-toggle="modal" data-bs-target="#editModal{{ product.id }}">
                        <i class="fas fa-edit"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-danger" data-bs-toggle="modal" data-bs-target="#deleteModal{{ product.id }}">
                        <i class="fas fa-trash"></i>
                    </button>
                </td>
            </tr>
            <!-- Edit Modal -->
            <div class="modal fade" id="editModal{{ product.id }}" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <form method="post" action="{% url 'prices:product_edit' product.id %}">
                            {% csrf_token %}
                            <div class="modal-header">
                                <h5 class="modal-title">Edit Product</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <div class="mb-3">
                                    <label class="form-label">Product Name</label>
                                    <input type="text" name="name" class="form-control" value="{{ product.name }}" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Price (Ksh)</label>
                                    <input type="number" step="0.01" name="price" class="form-control" value="{{ product.price }}" required>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i>Update</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <!-- Delete Modal -->
            <div class="modal fade" id="deleteModal{{ product.id }}" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <form method="post" action="{% url 'prices:product_delete' product.id %}">
                            {% csrf_token %}
                            <div class="modal-header">
                                <h5 class="modal-title">Delete Product</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                Are you sure you want to delete "<strong>{{ product.name }}</strong>"?
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                <button type="submit" class="btn btn-danger"><i class="fas fa-trash me-1"></i>Delete</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            {% empty %}
            <tr><td colspan="4" class="text-center text-muted">No products available.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
<!-- Add Product button -->
<div class="mt-3">
    <button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#addModal"><i class="fas fa-plus me-1"></i>Add Product</button>
</div>
