{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h2 class="text-center mb-4"><i class="fas fa-search-dollar me-2"></i>Check Prices</h2>
        <form method="get" class="row g-3 mb-4">
            <div class="col-md-8 offset-md-2">
                <div class="input-group">
                    <input type="text" name="search" class="form-control" placeholder="Search for a product..." value="{{ search_query }}">
                    <button type="submit" class="btn btn-dark">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<div class="row">
    {% for product in products %}
        <div class="col-6 col-md-4 col-lg-3 mb-3">
            <div class="card h-100 shadow-sm">
                <div class="card-body text-center">
                    <i class="fas fa-box fa-2x text-secondary mb-2"></i>
                    <h6 class="card-title">{{ product.name }}</h6>
                    <p class="card-text fw-bold mb-1">Ksh {{ product.price }}</p>
                    <small class="text-muted">Buying: Ksh {{ product.buying_price }}</small>
                </div>
            </div>
        </div>
    {% empty %}
        <div class="col-12 text-center text-muted">
            <i class="fas fa-exclamation-circle fa-3x mb-2"></i>
            <p>No products found.</p>
        </div>
    {% endfor %}
</div>
{% endblock %}
